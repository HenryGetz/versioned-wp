name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Database Changes
        id: db_changes
        run: |
          set -euo pipefail

          before_sha="${{ github.event.before }}"
          after_sha="${{ github.sha }}"

          if [[ -z "${before_sha}" || "${before_sha}" == "0000000000000000000000000000000000000000" ]]; then
            before_sha="$(git rev-parse "${after_sha}^")"
          fi

          if git diff --name-only "${before_sha}" "${after_sha}" | grep -Eq '^(database/snapshots/wordpress-baseline.sql|database/LOCAL_SITEURL)$'; then
            echo "database_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Database deployment artifacts changed in this push."
          else
            echo "database_changed=false" >> "${GITHUB_OUTPUT}"
            echo "No database deployment artifacts changed in this push."
          fi

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "placeholder-text"

      - name: Add Known Hosts
        run: ssh-keyscan -H ${{ secrets.TARGET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via Rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.lando.yml' \
            --exclude='README.md' \
            --exclude='wp-config.php' \
            ./ ${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }}:${{ secrets.TARGET_DIR }}

      - name: Skip Database Sync (No DB Changes)
        if: steps.db_changes.outputs.database_changed != 'true'
        run: echo "No DB deployment artifacts changed. Skipping DB import."

      - name: Sync Database and Fix URLs
        if: steps.db_changes.outputs.database_changed == 'true'
        run: |
          ssh ${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }} << 'EOF'
            set -euo pipefail

            # CHANGEME-remote-backup-path should be an absolute path writable by the deploy user.
            snapshot_dir="CHANGEME-remote-backup-path"
            if [[ "${snapshot_dir}" == CHANGEME-* ]]; then
              echo "Replace CHANGEME-remote-backup-path in .github/workflows/deploy-staging.yml"
              exit 1
            fi

            cd ${{ secrets.TARGET_DIR }}/wordpress

            mkdir -p "${snapshot_dir}"
            backup_file="${snapshot_dir}/pre-deploy-${{ github.sha }}-$(date -u +%Y%m%dT%H%M%SZ).sql"
            wp db export "${backup_file}"
            echo "Created pre-deploy backup: ${backup_file}"

            if [[ ! -s ../database/snapshots/wordpress-baseline.sql ]]; then
              echo "database/snapshots/wordpress-baseline.sql is missing or empty."
              exit 1
            fi
            wp db import ../database/snapshots/wordpress-baseline.sql

            source_url="$(tr -d '\r\n' < ../database/LOCAL_SITEURL)"
            if [[ -z "${source_url}" ]]; then
              echo "database/LOCAL_SITEURL is empty; refusing to run search-replace"
              exit 1
            fi

            staging_url="${{ secrets.STAGING_URL }}"
            if [[ -z "${staging_url}" ]]; then
              echo "STAGING_URL secret is empty."
              exit 1
            fi

            echo "Using source URL: ${source_url}"
            echo "Using staging URL: ${staging_url}"
            wp search-replace "${source_url}" "${staging_url}" --all-tables --precise
            wp cache flush
          EOF
